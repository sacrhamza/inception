# version: '3.14'
services:

  nginx:
    build:
      dockerfile: nginx.dockerfile
      context: ./requirements/nginx
    image: nginx:inception
    container_name: inception_nginx
    pull_policy: never
    networks:
        - inception_network
    volumes:
      - wordpress_volume:/var/www/wordpress/
    env_file: .env
    depends_on:
      wordpress:
        condition: service_started
    restart: unless-stopped
    ports:
      - 443:443

  wordpress:
    build:
      dockerfile: wordpress.dockerfile
      context: ./requirements/wordpress/
    image: wordpress:inception
    container_name: inception_wordpress
    pull_policy: never
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - inception_network

    volumes:
      - wordpress_volume:/var/www/wordpress/
    # healthcheck:
    #   test: 
    #   interval:
    #   retries:
    #   start_period:
    #   timeout: 
    env_file: .env
    secrets:
      - database_secrets
      - wordpress_secrets

  mariadb:
    build:
      dockerfile: mariadb.dockerfile
      context: ./requirements/mariadb/
    container_name: inception_mariadb
    image: mariadb:inception
    pull_policy: never 
    networks:
      - inception_network
    volumes:
      - database_volume:/var/lib/mysql
    secrets:
      - database_secrets
    restart: unless-stopped
    healthcheck:
      test: /usr/local/bin/service_healthy.sh
      interval: 1s
      retries: 20
      start_period: 1s
      timeout: 100s

networks:
  inception_network:
    name: inception_network 

volumes:
  wordpress_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hsacr/data/wordpress
  database_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hsacr/data/database/

secrets:
  database_secrets:
    file: ../secrets/database_secrets
  wordpress_secrets:
    file: ../secrets/wordpress_secrets
