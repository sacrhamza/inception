# version: '3.14'
services:

  nginx:
    build:
      dockerfile: nginx.dockerfile
      context: ./requirements/nginx
    image: nginx:inception
    container_name: inception_nginx
    pull_policy: never
    ports:
      - 443:443
    networks:
        - inception_network
    volumes:
      - wordpress_volume:/var/www/wordpress/
    depends_on:
      wordpress:
        condition: service_healthy

  wordpress:
    build:
      dockerfile: wordpress.dockerfile
      context: ./requirements/wordpress/
    image: wordpress:inception
    container_name: inception_wordpress
    pull_policy: never
    networks:
        - inception_network
    volumes:
      - wordpress_volume:/var/www/wordpress/
    # healthcheck:
    #   test: 
    #   interval:
    #   retries:
    #   start_period:
    #   timeout: 
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    build:
      dockerfile: mariadb.dockerfile
      context: ./requirements/mariadb/
    # container name to name a container oviously
    container_name: inception_mariadb
    # just to name the image
    image: mariadb:inception
    pull_policy: never 
    networks:
      - inception_network
    # volumes:
    #   - inception_volume:/database
    healthcheck:
      test: /bin/service_healthy.sh
      interval: 0.25s
      retries: 10
      start_period: 1s
      timeout: 5s

  adminer:
    build:
      dockerfile: adminer.dockerfile
      context: ./requirements/bonus/adminer/
    pull_policy: never
    image: adminer:inception
    container_name: inception_adminer
    networks:
      - inception_network
    ports:
      - 9000:443
    depends_on:
      mariadb:
        condition: service_healthy

networks:
  inception_network:
    name: inception_network 

volumes:
  wordpress_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hsacr/data/wordpress
  database_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hsacr/data/database/
